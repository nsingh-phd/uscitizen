<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Citizen Ready · US Civics Test Practice</title>
  <meta name="description" content="Practice for the U.S. naturalization civics test with every official USCIS question, flip-card flashcards, and a mock interview that follows the real rules.">
  <meta name="theme-color" content="#13285c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2313285c'/%3E%3Cpath fill='%23fff' d='M16 6.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6-4.5-4.2 6.1-.7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#home" aria-label="Citizen Ready home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Citizen <b>Ready</b></span>
      </a>
      <nav class="tabs" aria-label="Sections" id="tabs"></nav>
      <button type="button" class="avatar-btn" data-go="me" id="avatar-btn" aria-label="Your profile"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="foot">
    <p>Questions and answers from official <a href="https://www.uscis.gov/citizenship/find-study-materials-and-resources/study-for-the-test" target="_blank" rel="noopener">USCIS study materials</a>. Not affiliated with USCIS.</p>
    <p>Made by <a href="https://nsingh.phd" rel="noopener">Narinder Singh</a> · Your progress stays on this device.</p>
  </footer>

  <nav class="bottom-nav" aria-label="Sections" id="bottom-nav"></nav>

  <dialog class="sheet" id="profile-dialog" aria-labelledby="profile-dialog-title">
    <form method="dialog" class="sheet-body" id="profile-form">
      <h2 id="profile-dialog-title">Add a learner</h2>
      <label class="field">
        <span>Name</span>
        <input type="text" name="name" maxlength="24" autocomplete="off" required placeholder="e.g. Priya">
      </label>
      <div class="row-end">
        <button type="button" class="btn btn-quiet" value="cancel" id="profile-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" value="ok">Add</button>
      </div>
    </form>
  </dialog>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <div class="sr-only" aria-live="polite" id="live"></div>

  <script src="data.js"></script>
  <script src="english.js"></script>
  <script src="app.js"></script>
</body>
</html>
